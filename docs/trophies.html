<style>
:root{--bg:#fbfaf7;--fg:#1f1c17;--muted:#6b655a;--line:#ddd6c8;--card:#fff;--cell:#f0eadc;--cellhi:#e4d8bd;--accent:#8a5a14;--shadow:0 6px 24px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#171512;--fg:#ece6d8;--muted:#a39b8a;--line:#383229;--card:#201d18;--cell:#2b261f;--cellhi:#3a3328;--accent:#e0a64a;--shadow:0 6px 24px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:620px;margin:0 auto;padding:24px 16px 80px}
h1{margin:0 0 4px;font-size:1.7rem}
.sub{color:var(--muted);margin:0 0 20px}
section{margin:0 0 26px}
h2{font-size:1.05rem;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.subh{font-size:.9rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--cell);padding:3px;
  display:flex;align-items:center;justify-content:center;cursor:default;font:inherit;color:inherit}
.cell.group{cursor:pointer}
.cell:hover,.cell:focus-visible{background:var(--cellhi);outline:2px solid var(--accent);outline-offset:-1px}
.cell img{max-width:100%;max-height:100%;image-rendering:pixelated;pointer-events:none}
.cell .noimg{font-size:.7rem;color:var(--muted)}
.badge{position:absolute;right:2px;bottom:2px;font-size:.62rem;line-height:1;padding:2px 4px;border-radius:6px;background:var(--accent);color:var(--bg);font-weight:700;pointer-events:none}
#tip{position:fixed;z-index:50;max-width:min(320px,calc(100vw - 16px));padding:8px 10px;border-radius:8px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow);pointer-events:none;display:none}
#tip b{display:block}
#tip span{color:var(--muted);white-space:pre-line;font-size:.92rem}
#tip em{display:block;color:var(--accent);font-style:normal;font-size:.8rem;margin-top:4px}
#pop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#pop.open{display:flex}
#pop .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(460px,100%);max-height:90vh;overflow:auto;padding:14px}
#pop header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
#pop h3{margin:0;font-size:1.05rem}
#pop button.x{font:inherit;border:1px solid var(--line);background:var(--cell);color:var(--fg);border-radius:8px;padding:2px 10px;cursor:pointer}
</style>
</head>

ient Device","r":"This strange device seems to react to the Ancient Races magical capabilities... We may channel its power to increase their research potential!","i":"AncientDeviceArtifact.png"}]},{"items":[{"n":"Earth Core","r":"This piece of molten rock is continuously shifting its shape, responding to mysterious energy sources.","i":"EarthCoreArtifact.png"}]},{"items":[{"n":"Horn of the Kings","r":"It is said that when this horn is blown, the voices of past Dwarven Kings can be heard in the wind.","i":"HornOfTheKingsArtifact.png"}]},{"items":[{"n":"Flame of Bondelnar","r":"The magical azure flame of Bondelnar constantly emanates a silent, yet subtle, evil aura.","i":"FlameOfBondelnarArtifact.png"}]},{"items":[{"n":"Rough Stone","r":"A common, totally uninteresting stone.","i":"RoughStoneArtifact.png"}]},{"items":[{"n":"Scarab of Fortune","r":"You found the rarest of relics. This golden scarab will grant you 7 days of good luck, starting from now. Make good use of it!","i":"ScarabOfFortuneArtifact.png"}]},{"items":[{"n":"Chocolate Cookie","r":"Found in a wasteland made of cakes and sweets, snatched from the hands of an old woman...","i":"ChocolateCookieArtifact.png"}]},{"items":[{"n":"Fossilized Rodent","r":"What's this, a prehistoric mouse...?","i":"FossilizedRodentArtifact.png"}]},{"items":[{"n":"Power Orb","r":"Throbbing with arcane power.","i":"PowerOrbArtifact.png"}]},{"items":[{"n":"Pink Carrot","r":"The main product of properly nurtured Farms.","i":"PinkCarrotArtifact.png"}]},{"items":[{"n":"Bottled Voice","r":"The essence of a melodic Fairy voice.","i":"BottledVoiceArtifact.png"}]},{"items":[{"n":"Lucky Clover","r":"A perfectly shaped four-leaf clover. Each leaf is almost unnaturally identical to the other three.","i":"LuckyCloverArtifact.png"}]},{"items":[{"n":"Mini-treasure","r":"It's a small perfect replica of the old gold-filled treasure.","i":"MiniTreasureArtifact.png"}]},{"items":[{"n":"Pillar Fragment","r":"A tiny piece of the legendary pillars which sustain all the Heavens.","i":"PillarFragmentArtifact.png"}]},{"items":[{"n":"Divine Sword","r":"The shining golden sword of an Archangel. Its hilt feels pleasantly warm to the pure of heart, and burning hot for the villain.","i":"DivineSwordArtifact.png"}]},{"items":[{"n":"Ancient Coin Piece","r":"A common goblin lucky charm. The older it is, the luckier you are, or so they say.","i":"AncientCoinPieceArtifact.png"}]},{"items":[{"n":"Goblin Purse","r":"Heavy and roomy. Definitely too big for just pocket change.","i":"GoblinPurseArtifact.png"}]},{"items":[{"n":"Rotten Organ","r":"Ew... disgusting. It still pulses.","i":"RottenOrganArtifact.png"}]},{"items":[{"n":"Jaw Bone","r":"A jaw, missing more than half of its teeth.","i":"JawBoneArtifact.png"}]},{"items":[{"n":"Demonic Figurine","r":"An intricate figurine representing the evil face of a lesser demon.","i":"DemonicFigurineArtifact.png"}]},{"items":[{"n":"Demon Horn","r":"Still blazing with the flames of Hell. Handle with care.","i":"DemonHornArtifact.png"}]},{"items":[{"n":"Huge Titan Statue","r":"The granite representation of a giant wielding a lightning bolt in its fist. A foot appears to be missing.","i":"HugeTitanStatueArtifact.png"}]},{"items":[{"n":"Titan Shield","r":"A gargantuan metal shield, twice as tall as a common human.","i":"TitanShieldArtifact.png"}]},{"items":[{"n":"Glyph Table","r":"Contains all the secrets of the Druidic Alphabet.","i":"GlyphTableArtifact.png"}]},{"items":[{"n":"Stone of Balance","r":"A carved stone hovering above its pedestal.","i":"StoneOfBalanceArtifact.png"}]},{"items":[{"n":"Translucent Goo","r":"A completely odorless sticky substance with a diaphanous, unsettling glow.","i":"TranslucentGooArtifact.png"}]},{"items":[{"n":"Octopus-shaped Helmet","r":"A large helmet with empty metal prongs to accomodate tentacular appendages.","i":"OctopusShapedHelmetArtifact.png"}]},{"items":[{"n":"Dwarven Bow","r":"Actually a heavy throwing hammer.","i":"DwarvenBowArtifact.png"}]},{"items":[{"n":"Stone Tankard","r":"A very heavy mug for drinking the heaviest of beers.","i":"StoneTankardArtifact.png"}]},{"items":[{"n":"Ceremonial Dagger","r":"Its blade is unnaturally keen and sharp.","i":"CeremonialDaggerArtifact.png"}]},{"items":[{"n":"Arachnid Figurine","r":"If you are afraid of spiders, Drow aren't your faction.","i":"ArachnidFigurineArtifact.png"}]},{"items":[{"n":"Steel Plate","r":"A full plate made of hardened steel.","i":"SteelPlateArtifact.png"}]},{"items":[{"n":"Black Sword","r":"A long sword with an extremely sharp blade made of dark metal.","i":"BlackSwordArtifact.png"}]},{"items":[{"n":"Dragon Fang","r":"This huge fang can barely fit in the hands of a Titan.","i":"DragonFangArtifact.png"}]},{"items":[{"n":"Dragon Soul","r":"The extracted soul from an ancient dragon, wields the power to end the world in an instant. Also makes a good soup ingredient.","i":"DragonSoulArtifact.png"}]},{"items":[{"n":"Vanilla Flavor Juice","r":"An essence from extremely savory vanilla beans.","i":"VanillaFlavorJuiceArtifact.png"}]},{"items":[{"n":"Ancient Cocoa Bean","r":"Despite being centuries old, it still smells like top-quality cocoa.","i":"AncientCocoaBeanArtifact.png"}]},{"items":[{"n":"Know Your Enemy, Part I","r":"All the knowledge you need stored in a handy book.","i":"KnowYourEnemyPartIArtifact.png"}]},{"items":[{"n":"Voodoo Doll","r":"You are now CURSED! And you feel a sting in your lower rear.","i":"VoodooDollArtifact.png"}]},{"items":[{"n":"Wall Fragment","r":"A fragment of an utterly and completely unbreakable wall. Enjoy your paradox.","i":"WallFragmentArtifact.png"}]},{"items":[{"n":"Spiky Rough Egg","r":"What a weird egg... it looks ages old, yet something alive is inside. Perhaps if you wait long enough, something will hatch?","i":"SpikyRoughEggArtifact.png"}]},{"items":[{"n":"Fortune Teller Machine","r":"A devilish star gazes upon your future. Is this a good or a bad sign...?","i":"FortuneTellerMachineArtifact.png"}]},{"items":[{"n":"Dawnstone","r":"Only found during sunrise hours. Emits a faint glow.","i":"DawnstoneArtifact.png"}]},{"items":[{"n":"Duskstone","r":"Only found during sunset hours. Absorbs light in a small radius.","i":"DuskstoneArtifact.png"}]},{"items":[{"n":"Ancient Heirloom","r":"Passed down countless generations.","i":"AncientHeirloomArtifact.png"}]},{"items":[{"n":"Obsidian Shard","r":"Extremely hard and black as darkness itself, this material cannot apparently be carved or melted. It is a mystery how you can make this thing into a sword.","i":"ObsidianShardArtifact.png"}]},{"items":[{"n":"Know Your Enemy, Part II","r":"Much more knowledge than you need, stored in a handy book.","i":"KnowYourEnemyPartIIArtifact.png"}]},{"items":[{"n":"Veteran Figurine","r":"The warrior of a thousand battles, ultimate champion of the Realms.\n\nPassive effect: allows Mercenaries to benefit from all faction challenges.","i":"VeteranFigurineArtifact.png"}]},{"items":[{"n":"Wall Chunk","r":"A bigger piece of the infamous Ascension Wall.","i":"WallChunkArtifact.png"}]},{"items":[{"n":"Excavated Mirage","r":"You know all too well this does not exist, yet it fills you with hope and optimism.","i":"ExcavatedMirageArtifact.png"}]},{"items":[{"n":"Ancestral Hourglass","r":"The silver sands contained within seem to never stop flowing.","i":"AncestralHourglassArtifact.png"}]},{"items":[{"n":"Silk Cloth","r":"The purest silk made for Fairies, by Fairies, of Fairies.","i":"SilkClothArtifact.png"}]},{"items":[{"n":"Raw Emerald","r":"Just slightly less precious than a raw Ruby.","i":"RawEmeraldArtifact.png"}]},{"items":[{"n":"Fossilized Wing","r":"The remains of an Angel fallen to earth.","i":"FossilizedWingArtifact.png"}]},{"items":[{"n":"Spiked Whip","r":"Use with caution. You do not want to exterminate all your slaves.","i":"SpikedWhipArtifact.png"}]},{"items":[{"n":"Dusty Coffin","r":"Sealed since forever, yet you can hear a strange noise from within.","i":"DustyCoffinArtifact.png"}]},{"items":[{"n":"Crystallized Lava","r":"Incandescent but still. Can be used efficiently as a desk lamp.","i":"CrystallizedLavaArtifact.png"}]},{"items":[{"n":"Titan Helmet","r":"Made of enough metal to craft a human-sized full plate.","i":"TitanHelmetArtifact.png"}]},{"items":[{"n":"Branch of the Life Tree","r":"Despite being torn from its source tree, it keeps growing buds and leaves.","i":"BranchOfTheLifeTreeArtifact.png"}]},{"items":[{"n":"Nightmare Figment","r":"An unshaped, ephemeral substance which is politely trying to corrupt your mind.","i":"NightmareFigmentArtifact.png"}]},{"items":[{"n":"Beard Hair","r":"Hopefully coming from a real dwarven beard.","i":"BeardHairArtifact.png"}]},{"items":[{"n":"Poison Vial","r":"One drop of this is enough to fell thousands of non-immune creatures.","i":"PoisonVialArtifact.png"}]},{"items":[{"n":"Dragon Scale","r":"Very high on the realms' most accurate hardiness rankings.","i":"DragonScaleArtifact.png"}]},{"items":[{"n":"Lantern of Guidance","r":"Follow the guiding light, o wanderer, for it shall bring you fortune.","i":"LanternOfGuidanceArtifact.png"}]},{"items":[{"n":"Oil Lamp","r":"Rub it, polish it. And remember to express your desires precisely, lest you want to face dire consequences.","i":"OilLampArtifact.png"}]},{"items":[{"n":"Spark of Life","r":"The spark of Creation, dimly shining from the bottom of its encasing crystal.","i":"SparkOfLifeArtifact.png"}]},{"items":[{"n":"First Iron Fragment","r":"It looks like a piece of an iron object. It's broken off on two sides.","i":"FirstIronFragmentArtifact.png"}]},{"items":[{"n":"Second Iron Fragment","r":"It looks like a piece of an iron object. It's broken off on two sides.","i":"SecondIronFragmentArtifact.png"}]},{"items":[{"n":"Third Iron Fragment","r":"It looks like a piece of an iron object. It's broken off on two sides.","i":"ThirdIronFragmentArtifact.png"}]},{"items":[{"n":"First Crystal Fragment","r":"A strange, glass-like material that appears to have been shattered into three pieces.","i":"FirstCrystalFragmentArtifact.png"}]},{"items":[{"n":"Second Crystal Fragment","r":"A strange, glass-like material that appears to have been shattered into three pieces.","i":"SecondCrystalFragmentArtifact.png"}]},{"items":[{"n":"Third Crystal Fragment","r":"A strange, glass-like material that appears to have been shattered into three pieces.","i":"ThirdCrystalFragmentArtifact.png"}]},{"items":[{"n":"First Stone Fragment","r":"Made from stone so ancient it is unknown to the current world. Two parts seem to be missing.","i":"FirstStoneFragmentArtifact.png"}]},{"items":[{"n":"Second Stone Fragment","r":"Made from stone so ancient it is unknown to the current world. Two parts seem to be missing.","i":"SecondStoneFragmentArtifact.png"}]},{"items":[{"n":"Third Stone Fragment","r":"Made from stone so ancient it is unknown to the current world. Two parts seem to be missing.","i":"ThirdStoneFragmentArtifact.png"}]},{"items":[{"n":"Planetary Force","r":"Planets aligning seem to affect your realm in different ways...","i":"PlanetaryForceArtifact.png"}]},{"items":[{"n":"Mercenary Insignia","r":"The infamous metal cross of the Mercenaries. You should be both proud and afraid to carry one.","i":"MercenaryInsigniaArtifact.png"}]},{"items":[{"n":"Obsidian Crown","r":"The legendary Black Crown of the Mercenary Lord. Some words are engraved into the inner circle at its base: \"Aran en Ilya, Silas en Quenta\".","i":"ObsidianCrownArtifact.png"}]},{"items":[{"n":"Forgotten Relic","r":"Intricate leylines of mana cover the surface of this stone, moving and flailing endlessly to create ever-different patterns.","i":"ForgottenRelicArtifact.png"}]},{"items":[{"n":"Mana Loom","r":"Used to weave even the thinnest mana strings.\n\nProvides INF budget in the Spellcraft branch.","i":"FacilitySpellcraft2.png"}]},{"items":[{"n":"Factory","r":"Mass-production is the way to go.\n\nProvides INF budget in the Craftsmanship branch.","i":"FacilityCraftsmanship2.png"}]},{"items":[{"n":"Mythos","r":"Accurate historical list of every existing or non-existing deity.\n\nProvides INF budget in the Divine branch.","i":"FacilityDivine2.png"}]},{"items":[{"n":"Vault","r":"Never a place could be more secure.\n\nProvides INF budget in the Economics branch.","i":"FacilityEconomics2.png"}]},{"items":[{"n":"Athanor","r":"The legendary oven that could smelt souls into matter.\n\nProvides INF budget in the Alchemy branch.","i":"FacilityAlchemy2.png"}]},{"items":[{"n":"Battlefield","r":"An extremely accurate replica of a battle fought long ago.\n\nProvides INF budget in the Warfare branch.","i":"FacilityWarfare2.png"}]},{"items":[{"n":"Apeiron","r":"The source of everything. Can fit in the average pocket.","i":"FacilityForbidden.png"}]},{"items":[{"n":"Glowing Wing","r":"And this is why Fairies don't need torches.","i":"GlowingWingArtifact.png"}]},{"items":[{"n":"Sylvan Mirror","r":"An Elf with messy hair is not an Elf, by their own laws.","i":"SylvanMirrorArtifact.png"}]},{"items":[{"n":"Solid Cloud","r":"Angels have the power to save your life! And make a backup of it on the internet.","i":"SolidCloudArtifact.png"}]},{"items":[{"n":"Orc Fang Necklace","r":"To remind your slaves who's in charge.","i":"OrcFangNecklaceArtifact.png"}]},{"items":[{"n":"Blood Chalice","r":"The healthiest vampire breakfast.","i":"BloodChaliceArtifact.png"}]},{"items":[{"n":"Demon Tail","r":"Said to bring great luck to whom it possess...es.","i":"DemonTailArtifact.png"}]},{"items":[{"n":"Frozen Lightning","r":"A sculpture representing the embodiment of Titanic power.","i":"FrozenLightningArtifact.png"}]},{"items":[{"n":"Primal Leaf","r":"Druid Catalyst for channeling the power of nature.","i":"PrimalLeafArtifact.png"}]},{"items":[{"n":"The Blackest Ink","r":"High-quality, freshly produced Faceless ink.","i":"TheBlackestInkArtifact.png"}]},{"items":[{"n":"Dwarven Anvil","r":"Every dwarven child is required to bring this to school every day.","i":"DwarvenAnvilArtifact.png"}]},{"items":[{"n":"Stiletto <script>
(function(){
  var SECTIONS = JSON.parse(document.getElementById('data').textContent);
  var root=document.getElementById('root'), tip=document.getElementById('tip'),
      pop=document.getElementById('pop'), popgrid=document.getElementById('popgrid'), poptitle=document.getElementById('poptitle');
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function icon(it){
    if(it.i){ var img=el('img'); img.src='assets/icons/'+encodeURIComponent(it.i); img.alt=''; img.loading='lazy'; return img; }
    return el('span','noimg','?');
  }
  function showTip(it, anchor, hint){
    tip.textContent='';
    tip.appendChild(el('b',null,it.n));
    if(it.r) tip.appendChild(el('span',null,it.r));
    if(hint) tip.appendChild(el('em',null,hint));
    tip.style.display='block';
    var a=anchor.getBoundingClientRect(), t=tip.getBoundingClientRect();
    var x=Math.min(Math.max(8,a.left+a.width/2-t.width/2), window.innerWidth-t.width-8);
    var y=a.top-t.height-8; if(y<8) y=a.bottom+8;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  }
  function hideTip(){ tip.style.display='none'; }
  function bindTip(node, it, hint){
    node.addEventListener('mouseenter',function(){ showTip(it,node,hint); });
    node.addEventListener('mouseleave',hideTip);
    node.addEventListener('focus',function(){ showTip(it,node,hint); });
    node.addEventListener('blur',hideTip);
  }
  function cellButton(it, extraClass){
    var b=el('button','cell'+(extraClass?' '+extraClass:'')); b.type='button';
    b.setAttribute('aria-label', it.n+(it.r?': '+it.r:''));
    b.appendChild(icon(it));
    return b;
  }
  function openGroup(c){
    poptitle.textContent=c.title+' ('+c.items.length+' tiers)';
    popgrid.textContent='';
    c.items.forEach(function(it){
      var b=cellButton(it); bindTip(b,it); b.addEventListener('click',function(e){ e.stopPropagation(); showTip(it,b); });
      popgrid.appendChild(b);
    });
    hideTip(); pop.classList.add('open'); document.getElementById('popclose').focus();
  }
  function closePop(){ pop.classList.remove('open'); hideTip(); }
  document.getElementById('popclose').addEventListener('click',closePop);
  pop.addEventListener('click',function(e){ if(e.target===pop) closePop(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closePop(); });
  document.addEventListener('scroll',hideTip,true);

  function grid(cells){
    var g=el('div','grid');
    cells.forEach(function(c){
      if(c.items.length===1){
        var it=c.items[0], b=cellButton(it); bindTip(b,it);
        b.addEventListener('click',function(){ showTip(it,b); });
        g.appendChild(b);
      } else {
        var first=c.items[0], last=c.items[c.items.length-1];
        var b=cellButton(first,'group');
        b.setAttribute('aria-label', c.title+', '+c.items.length+' tiers');
        b.appendChild(el('span','badge','\u00d7'+c.items.length));
        var summary={n:c.title,r:first.n+' \u2192 '+last.n};
        bindTip(b,summary,c.items.length+' tiers \u2014 click to view');
        b.addEventListener('click',function(){ openGroup(c); });
        g.appendChild(b);
      }
    });
    return g;
  }
  SECTIONS.forEach(function(s){
    var sec=el('section'); sec.appendChild(el('h2',null,s.title));
    if(s.subs){ s.subs.forEach(function(sub){ sec.appendChild(el('h3','subh',sub.title)); sec.appendChild(grid(sub.cells)); }); }
    else sec.appendChild(grid(s.cells));
    root.appendChild(sec);
  });
})();
</script>
</body>
</html>
