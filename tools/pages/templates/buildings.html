<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/bg.css"><script src="assets/bg.js" defer></script>
<title>Realm Grinder Buildings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
/*THEME*/
main{max-width:860px;margin:0 auto;padding:16px 16px 80px}
main .blurb{margin:4px 0 10px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:20px;align-items:start}
#info h2{margin:0 0 4px}
#info h3{margin:14px 0 2px;color:var(--accent)}
#info p{margin:0 0 6px;white-space:pre-line}
#info .hint{color:var(--muted)}
#info .formula{padding:2px 0;overflow-x:auto;overflow-y:hidden}
#info hr.fsep{border:0;border-top:1px solid var(--line);margin:10px 0}
#info ul.vars{margin:2px 0 6px}
#info ul.vars li{margin:0}
#info ul.vars b{display:inline;font-family:inherit;font-size:inherit}
#info ul.items{margin:0 0 6px;padding-left:0}
#info ul.items li{margin:0 0 2px;padding-left:16px;position:relative}
#info ul.items li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
#info .big{font-size:1.15rem}
#filters.bar{position:static;margin:0 0 14px;padding:2px 0;border-bottom:0;background:none}
#list{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
/* a button as in the game (130 x 57, one set per alignment, drawn larger) with the building's icon inside it on the left and its name; the open building is pressed */
#list button{display:block;padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer}
#list button .pl{font-family:"Liony",system-ui,sans-serif;font-weight:700;font-size:.9rem;line-height:1.05;color:#f6f6f6;text-shadow:0 1px 2px #000,0 0 2px #000;
  width:176px;height:74px;padding:8px 10px 8px 12px;box-sizing:border-box;background:transparent no-repeat center/100% 100%;image-rendering:pixelated;
  display:flex;align-items:center;gap:6px;text-align:left}
#list button .pl .ic{flex:none;width:46px;height:46px;border:4px solid transparent;background:#000;background-clip:padding-box;
  border-image:url(assets/ui/trim/Gold.png) 8 fill / 4px / 0 stretch;image-rendering:pixelated}      /* the golden frame and black background of the icon */
#list button .pl .ic img{display:block;width:46px;height:46px;image-rendering:pixelated}
#list button:focus-visible .pl{outline:2px solid var(--accent);outline-offset:-2px}
#list[data-al="good"] .pl{background-image:url(assets/ui/buildings/goodBuilding_Up.png)}
#list[data-al="good"] button:hover .pl{background-image:url(assets/ui/buildings/goodBuilding_Hover.png)}
#list[data-al="good"] button[aria-pressed="true"] .pl{background-image:url(assets/ui/buildings/goodBuilding_Down.png)}
#list[data-al="evil"] .pl{background-image:url(assets/ui/buildings/evilBuilding_Up.png)}
#list[data-al="evil"] button:hover .pl{background-image:url(assets/ui/buildings/evilBuilding_Hover.png)}
#list[data-al="evil"] button[aria-pressed="true"] .pl{background-image:url(assets/ui/buildings/evilBuilding_Down.png)}
#list[data-al="neutral"] .pl{background-image:url(assets/ui/buildings/neutralBuilding_Up.png)}
#list[data-al="neutral"] button:hover .pl{background-image:url(assets/ui/buildings/neutralBuilding_Hover.png)}
#list[data-al="neutral"] button[aria-pressed="true"] .pl{background-image:url(assets/ui/buildings/neutralBuilding_Down.png)}
/* the Farm, Inn, Blacksmith and Hall of Legends are always neutral */
#list button.neu .pl{background-image:url(assets/ui/buildings/neutralBuilding_Up.png)}
#list button.neu:hover .pl{background-image:url(assets/ui/buildings/neutralBuilding_Hover.png)}
#list button.neu[aria-pressed="true"] .pl{background-image:url(assets/ui/buildings/neutralBuilding_Down.png)}
@media (max-width:640px){.layout{grid-template-columns:minmax(0,1fr)}#list{order:-1}}
/*SEARCH_CSS*/
</style>
</head>
<body>
<main>
<nav><a href="index.html">Home</a><a href="buildings.html" aria-current="page">Buildings</a></nav>
<h1>Buildings</h1>
<p class="blurb">__BLURB__</p>
<div class="layout">
<div><div id="filters" class="bar"><div class="row"></div></div><div id="info"></div></div>
<div id="list" role="group" aria-label="Buildings"></div>
</div>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var info=document.getElementById('info'), list=document.getElementById('list'), filt=document.querySelector('#filters .row'), btns=[], cur=null, align=0;      // align: the line of buildings shown (0 Good, 1 Evil, 2 Neutral)
  function nm(b){ return b.names.length>1 ? [b.names[align]] : b.names; }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function math(tex, node){
    if(window.katex){ try{ katex.render('\\displaystyle '+tex,node,{throwOnError:false,displayMode:false}); return; }catch(e){} }
    node.textContent=tex;
  }
  function num(x){ return x>=1e15 ? x.toExponential(2).replace('e+','e') : x.toLocaleString('en-US',{maximumFractionDigits:6}); }
  function formulas(box, fs){
    (fs||[]).forEach(function(f,fi){
      if(fi) box.appendChild(el('hr','fsep'));
      var d=el('div','formula'); math(f.latex,d); box.appendChild(d);
      if(f.vars){ var ul=el('ul','vars'); f.vars.forEach(function(v){ var li=el('li'), b=el('b'); math(v[0],b); li.appendChild(b); li.appendChild(document.createTextNode(' — '+v[1])); ul.appendChild(li); }); box.appendChild(ul); }
    });
  }
  function show(b){
    cur=b; info.textContent='';
    btns.forEach(function(x){ x.b.setAttribute('aria-pressed', x.i===b.i ? 'true' : 'false'); });
    info.appendChild(el('h2',null,nm(b).join(' / ')));
    var p=b.i===11 ? D.hall : D.production;
    info.appendChild(el('h3',null,p.title)); info.appendChild(el('p',null,p.text));
    if(b.i===11) formulas(info, p.formulas);
    else info.appendChild(el('p','big',num(b.prod)+' coins per second'));
    var c=D.cost;
    info.appendChild(el('h3',null,c.title)); info.appendChild(el('p',null,c.text));
    info.appendChild(el('p','big','Price of the first one: '+num(b.cost)+' coins'));
    formulas(info, c.formulas);
    var rs=c.reductions.filter(function(r){ return !r.only || r.only.indexOf(b.i)>=0; });
    if(rs.length){
      info.appendChild(el('p',null,c.reductions_title));
      var ul=el('ul','items'); rs.forEach(function(r){ ul.appendChild(el('li',null,r.text)); }); info.appendChild(ul);
    }
    try{ history.replaceState(null,'','#'+b.id); }catch(e){}
  }
  D.buildings.forEach(function(b){
    var bt=el('button'); bt.type='button'; bt.setAttribute('aria-pressed','false');
    bt.addEventListener('click',function(){ show(b); });
    if(b.names.length===1) bt.className='neu';      // one name for every alignment: always the neutral button
    list.appendChild(bt); btns.push({b:bt,i:b.i,d:b});
  });
  function labels(){ list.setAttribute('data-al',['good','evil','neutral'][align]); btns.forEach(function(x){ x.b.textContent=''; var d=x.d, k=d.names.length>1 ? align : 0;
    var pl=el('span','pl'), im=el('img'); im.src=d.icons[k]; im.alt=''; var ic=el('span','ic'); ic.appendChild(im); pl.appendChild(ic);
    var tx=el('span'); tx.textContent=nm(d).join(' / '); pl.appendChild(tx); x.b.appendChild(pl); }); }
  function pick(label, names, def, on){
    var l=el('label'), b=el('b',null,label), s=el('select');
    names.forEach(function(n,k){ var o=el('option',null,n); o.value=k; if(k===def) o.selected=true; s.appendChild(o); });
    s.addEventListener('change',function(){ on(+s.value); });
    l.appendChild(b); l.appendChild(s); filt.appendChild(l);
    s.id='f'+filt.children.length; l.htmlFor=s.id;
  }
  pick('Alignment',['Good','Evil','Neutral'],0,function(k){ align=k; labels(); if(cur) show(cur); });
  pick('Second alignment',['Order','Balance','Chaos','None'],3,function(){});      // it does not change anything on this page yet
  var alSel=document.querySelector('#filters select'), alChosen=false;
  alSel.addEventListener('change',function(){ alChosen=true; });
  function followBg(){      // the alignment of the background picture (picked at random on every load) is the starting choice
    var d=document.getElementById('bgfx'), m=/bg\/(good|evil|neutral)/.exec((d&&d.style.backgroundImage)||'');
    if(alChosen || !m) return;
    align=['good','evil','neutral'].indexOf(m[1]); alSel.value=String(align); labels(); if(cur) show(cur);
  }
  document.addEventListener('DOMContentLoaded',followBg); window.addEventListener('load',followBg);
  enhanceSelects();      // the page-drawn drop-downs (game font, steel border) from the shared script
  labels();
  var first=D.buildings.filter(function(b){ return location.hash.slice(1)===b.id; })[0];
  if(first) show(first); else info.appendChild(el('p','hint','Select a building on the right.'));
  window.addEventListener('load',function(){ var cur=btns.filter(function(x){ return x.b.getAttribute('aria-pressed')==='true'; })[0]; if(cur) cur.b.click(); });
/*SEARCH_JS*/
})();
</script>
</body>
</html>
