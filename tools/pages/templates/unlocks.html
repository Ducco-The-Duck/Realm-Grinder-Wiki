<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/bg.css"><script src="assets/bg.js" defer></script>
<title>__TITLE__</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
/*THEME*/
main{max-width:780px;margin:0 auto;padding:16px 16px 80px}
.sub{color:var(--muted);margin:0 0 18px}
.mech{margin:0 0 26px}
.mech h2{margin:0 0 4px}
.mech .unl{color:var(--muted);margin:0 0 6px}
.mech a,ul.items a,.rtab a{color:var(--accent)}
.mech h3{margin:10px 0 2px;color:var(--accent)}
.cell{position:relative;float:right;width:89px;height:89px;margin:0 0 8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--cell);padding:3px;
  display:flex;align-items:center;justify-content:center;cursor:default;font:inherit;color:inherit}
.cell:hover,.cell:focus-visible{background:var(--cellhi);outline:2px solid var(--accent);outline-offset:-1px}
.cell img{max-width:100%;max-height:100%;image-rendering:pixelated;pointer-events:none}
@media (max-width:700px){.cell{float:none;margin:0 0 8px}}
#tip{position:fixed;z-index:50;width:min(400px,calc(100vw - 16px));padding:10px 12px;border-radius:8px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow);pointer-events:none;display:none;font-size:.92rem}
#tip b{display:block;font-size:1rem}
#tip p{margin:2px 0 0;white-space:pre-line}
.mech p{margin:0 0 6px;white-space:pre-line}
.mech ul.items{margin:0 0 6px;padding-left:0}
.mech ul.items li{margin:0 0 2px;padding-left:16px;position:relative}
.mech ul.items li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.mech .formula{padding:2px 0;overflow-x:auto;overflow-y:hidden}
.mech hr.fsep{border:0;border-top:1px solid var(--line);margin:10px 0}
.mech p.after{margin-top:14px}
.mech p.line{margin-top:14px}
.mech ul.vars{margin:2px 0 6px}
.mech ul.vars li{margin:0}
.mech ul.vars b{display:inline;font-family:inherit;font-size:inherit}
.mech ul.items li.withup,.mech p.withup{display:flow-root;min-height:88px}      /* tall enough for its upgrade cell */
.empty{color:var(--muted)}
table.rtab{border-collapse:collapse;width:100%}
.rtab th,.rtab td{text-align:left;padding:6px 12px;border-bottom:1px solid var(--line)}
.rtab th{color:var(--accent)}
.rtab td.n{width:1%;white-space:nowrap}
/*SEARCH_CSS*/
</style>
</head>
<body>
<main>
<nav><a href="index.html">Home</a><a href="__FILE__" aria-current="page">Codex</a></nav>
<h1>__TITLE__</h1>
__UC__
<p class="sub">__SUB__</p>
<div id="root"></div>
</main>
<div id="tip" role="tooltip"></div>
<div id="more" role="dialog" aria-modal="true" aria-labelledby="moretitle"><div class="card">
  <header><h3 id="moretitle"></h3><button class="x" type="button" id="moreclose">Close</button></header>
  <div id="morebody"></div>
</div></div>
<div id="pop" role="dialog" aria-modal="true" aria-labelledby="poptitle"><div class="card">
  <header><h3 id="poptitle"></h3><button class="x" type="button" id="popclose">Close</button></header>
  <div class="grid" id="popgrid"></div>
</div></div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent), ASC = __ASC__, MODE = '__MODE__';
  document.body.setAttribute('data-nopin','upgrade spell');      // the upgrades and spells shown here are examples of the text: they cannot be pinned (the tray reads this)
  var root=document.getElementById('root');
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function linked(tag, text){      // text with links written as [words](page) and bold written as **words**
    var n=el(tag), re=/\*\*([^*]+)\*\*|\[([^\]]*)\]\(([^)]*)\)/g, at=0, m;
    while((m=re.exec(text))){
      n.appendChild(document.createTextNode(text.slice(at,m.index)));
      if(m[1]!=null) n.appendChild(el('strong',null,m[1])); else { var a=el('a',null,m[2]); a.href=m[3]; n.appendChild(a); }
      at=re.lastIndex;
    }
    n.appendChild(document.createTextNode(text.slice(at)));
    return n;
  }
  function math(tex, node){
    if(window.katex){ try{ katex.render('\\displaystyle '+tex,node,{throwOnError:false,displayMode:false}); return; }catch(e){} }
    node.textContent=tex;
  }
  var tip=document.getElementById('tip');
  function hideTip(){ tip.style.display='none'; }
  function showTip(card, anchor){
    tip.className=''; tip.textContent=''; tip.appendChild(el('b',null,card.name)); tip.appendChild(el('p',null,card.text));
    placeTip(anchor);
  }
  window.addEventListener('scroll',hideTip,{passive:true});
  bindPop(); bindMore();
  function apply(){
    root.textContent='';
    if(MODE==='all'){      // the overall Unlocks page: what the Reincarnate window says is unlocked
      var tb=el('table','rtab'), hd=el('tr'); hd.appendChild(el('th',null,'Reincarnation')); hd.appendChild(el('th',null,'Unlocked')); tb.appendChild(hd);
      (DATA.rows||[]).forEach(function(r){ var tr=el('tr'); tr.appendChild(el('td','n',String(r.n))); var td=el('td'); r.what.forEach(function(w){ var dv=el('div'), am=/^Ascension (\d+)$/.exec(w); if(am){ var al=el('a',null,w); al.href='unlocks-a'+am[1]+'.html'; dv.appendChild(al); } else dv.textContent=w; td.appendChild(dv); }); tr.appendChild(td); tb.appendChild(tr); });
      root.appendChild(tb); return;
    }
    if(MODE==='unlocks' && DATA.page){      // a written page: an overview, a line, then a heading for each Reincarnation
      var pg=DATA.page;
      root.appendChild(linked('p',pg.overview)); root.appendChild(el('hr','fsep'));
      (pg.entries||[]).forEach(function(e){
        var s=el('section','mech'); s.appendChild(el('h2',null,e.title));
        if(e.text) s.appendChild(linked('p',e.text));
        (e.sections||[]).forEach(function(c){
          s.appendChild(el('h3',null,c.title));
          if(c.side){ var sd=el('div','upgside'); c.side.forEach(function(n){ sd.appendChild(upgradeCell(DATA.ups[n], ASC, DATA.coins)); }); s.appendChild(sd); }      // at the right, the text runs around it
          if(c.text) s.appendChild(linked('p',c.text));
          (c.lists||[]).forEach(function(l){
            if(l.title){
              var lp=linked('p',l.title);
              if(l.side){ var ls=el('div','upgside'); l.side.forEach(function(n){ ls.appendChild(upgradeCell(DATA.ups[n], ASC, DATA.coins)); }); lp.insertBefore(ls, lp.firstChild); lp.classList.add('withup'); }      // the upgrades of this step at its right
              s.appendChild(lp);
            }
            if(l.items && l.items.length){
              var ul=el('ul','items');
              l.items.forEach(function(t,i){
                var li=linked('li',t);
                if(l.upgrades && l.upgrades[i]){ var ic=el('div','upgside'); ic.appendChild(upgradeCell(DATA.ups[l.upgrades[i]], ASC, DATA.coins)); li.insertBefore(ic, li.firstChild); li.classList.add('withup'); }      // the upgrade of this item at its right
                ul.appendChild(li);
              });
              s.appendChild(ul);
            }
          });
          if(c.upgrades){ var row=el('div','upgrow'); c.upgrades.forEach(function(n){ row.appendChild(upgradeCell(DATA.ups[n], ASC, DATA.coins)); }); s.appendChild(row); }
        });
        root.appendChild(s);
      });
      return;
    }
    if(MODE==='unlocks'){
      var ul0=el('ul','items');
      DATA.mechanics.filter(function(m){ return m.asc===ASC; }).forEach(function(m){
        var li=el('li'), a=el('a',null,m.name); a.href=m.href; li.appendChild(a);
        if(m.unlock && m.unlock.length) li.appendChild(document.createTextNode(' — '+m.unlock[0]));
        ul0.appendChild(li);
      });
      if(!ul0.children.length) root.appendChild(el('p','empty','No mechanics have been added for Ascension '+ASC+' yet.')); else root.appendChild(ul0);
      return;
    }
    var list=DATA.mechanics;
    list.forEach(function(m){
      var s=el('section','mech'), h=el('h2',null,m.name), inner=el('div'); s.id=m.id;
      s.appendChild(h);
      if(m.card){
        var c=makeCell(null, '', 'card|'+m.card.name), im=el('img'); im.src='assets/icons/'+m.card.icon; im.alt=m.card.name; c.appendChild(im);
        c.addEventListener('mouseenter',function(){ showTip(m.card,c); }); c.addEventListener('focus',function(){ showTip(m.card,c); });
        c.addEventListener('mouseleave',hideTip); c.addEventListener('blur',hideTip);
        inner.appendChild(c);
      }
      if(MODE!=='mechanics') (m.unlock||[]).forEach(function(u){ inner.appendChild(el('p','unl',u)); });      // the Mechanics page does not say when a mechanic becomes available
      if(m.note) inner.appendChild(el('p','unl',m.note));      // a faded note under the title of a mechanic: when it unlocks
      (m.sections||[]).forEach(function(c){
        if(c.title){ var h3=el('h3',null,c.title); if(c.id) h3.id=c.id; inner.appendChild(h3); }      // a subsection with an "id" can be linked to
        if(c.note) inner.appendChild(el('p','unl',c.note));      // the same, for a subsection
        if(c.side){ var us=el('div','upgside'); c.side.forEach(function(n){ us.appendChild(upgItemCell(DATA.items[n], m.asc_view!=null ? m.asc_view : m.asc, DATA.coins)); }); inner.appendChild(us); }      // an upgrade at the right of the text, as on the Upgrades pages (the text runs around it); shown at the Ascension where all of it exists ("asc_view")
        if(c.text) inner.appendChild(el('p',null,c.text));
        (c.formulas||[]).forEach(function(f,fi){
          if(fi) inner.appendChild(el('hr','fsep'));      // a line between formulas that follow each other
          var d=el('div','formula'); math(f.latex,d); inner.appendChild(d);
          if(f.vars){ var ul=el('ul','vars'); f.vars.forEach(function(v){ var li=el('li'), b=el('b'); math(v[0],b); li.appendChild(b); li.appendChild(document.createTextNode(' — ')); rich(li, v[1]); ul.appendChild(li); }); inner.appendChild(ul); }      // the text of a variable may hold $formulas$
        });
        (c.lines||[]).forEach(function(l){      // a line of its own, with the artifacts it names at its right
          var p=el('p','line');
          if(l.artifacts && l.artifacts.length){ var sd=el('div','upgside'); l.artifacts.forEach(function(n){ sd.appendChild(artifactCell(DATA.arts[n])); }); p.appendChild(sd); p.classList.add('withup'); }
          p.appendChild(document.createTextNode(l.text)); inner.appendChild(p);
        });
        if(c.link){ var lp=el('p'), la=el('a',null,c.link.text); la.href=c.link.href; lp.appendChild(la); inner.appendChild(lp); }
        if(c.after){
          var ap=el('p','after'), al=c.after_link, at=al ? c.after.indexOf(al.text) : -1;      // a link inside the sentence
          if(at>=0){ ap.appendChild(document.createTextNode(c.after.slice(0,at))); var aa=el('a',null,al.text); aa.href=al.href; ap.appendChild(aa); ap.appendChild(document.createTextNode(c.after.slice(at+al.text.length))); }
          else ap.textContent=c.after;
          inner.appendChild(ap);
        }
        (c.lists||[]).forEach(function(l){
          if(l.title) inner.appendChild(el('p',null,l.title));
          var ul=el('ul','items'); l.items.forEach(function(t){ ul.appendChild(el('li',null,t)); }); inner.appendChild(ul);
        });
      });
      s.appendChild(inner); root.appendChild(s);
      foldable(s, h, inner, m.name);
    });
    openHash(true);
  }
  function openHash(arrived){      // a link to a mechanic opens its section (also when it is followed from the Codex menu while this page is open); arriving from another page folds all the others
    var tgt=location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1))), sec=tgt && tgt.closest && tgt.closest('section.mech');      // a section, or a subsection of one
    if(sec && sec.querySelector('h2')){
      if(arrived===true) Array.prototype.forEach.call(root.querySelectorAll('section.mech'), function(s){ if(s!==sec && s._fold) s._fold(false); });
      if(!sec.classList.contains('open')) sec.querySelector('h2').click();
      tgt.scrollIntoView();
    }
  }
  window.addEventListener('hashchange',function(){ openHash(); });
  document.addEventListener('click',function(e){      // the same link again leaves the address unchanged, so no hashchange follows it
    var a=e.target.closest && e.target.closest('a'); if(a && a.hash && a.pathname===location.pathname) setTimeout(openHash,0);
  });
  apply();
  window.addEventListener('load', apply);
/*SEARCH_JS*/
})();
</script>
</body>
</html>
